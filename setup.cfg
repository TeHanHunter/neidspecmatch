[metadata]
name = neidspecmatch
version = attr: neidspecmatch.version.__version__
description = Matching NEID spectra to an empirical stellar library
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/TeHanHunter/neidspecmatch/
author = Te Han, Gudmundur Stefansson (author of HPFSpecMatch)
author_email = tehanhunter@gmail.com
license_files = LICENSE
license = MIT
classifiers =
    Topic :: Scientific/Engineering :: Astronomy
    Development Status :: 4 - Beta
keywords = NEID, spectra, astronomy

[options]
packages = find:
python_requires = >=3.10,<3.13
include_package_data = True
zip_safe = False
install_requires =
    numpy>=1.24,<2
    pandas>=1.5,<3
    scipy>=1.10,<2
    astropy>=5,<8
    matplotlib>=3.7,<4
    neidspec>=0.2.1,<0.3
    platformdirs>=3

[options.extras_require]
archive =
    astroquery>=0.4.7
    barycorrpy>=0.4.4
    pyneid
utilities =
    radvel>=1.4
    tqdm>=4.60
dev =
    pytest>=7
    build>=1

[options.package_data]
neidspecmatch.data =
    *.json

[options.entry_points]
console_scripts =
    neidspecmatch-fit = neidspecmatch.cli:fit_main
    neidspecmatch-crossval = neidspecmatch.cli:crossval_main
    neidspecmatch-crossval-figure = neidspecmatch.crossvalidation_figure:main
    neidspecmatch-library = neidspecmatch.cli:library_main
